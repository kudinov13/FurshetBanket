server {
    server_name furshetoria.ru www.furshetoria.ru 178.250.157.75;

    client_max_body_size 40M;

    # Загруженные файлы отдаёт nginx напрямую с диска —
    # next start не видит файлы, добавленные в public/ после сборки
    location /uploads/ {
        alias /var/www/furshet-banket/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/furshetoria.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/furshetoria.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.furshetoria.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = furshetoria.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name furshetoria.ru www.furshetoria.ru 178.250.157.75;
    return 404; # managed by Certbot
}
